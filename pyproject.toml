[project]
name = "files-sdk-workspace"
version = "0.0.0"
description = "Workspace root for files-sdk Python packages"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/_template"]

[tool.uv.sources]
files-sdk = { workspace = true }
files-sdk-s3 = { workspace = true }
files-sdk-r2 = { workspace = true }
files-sdk-uploadthing = { workspace = true }
files-sdk-minio = { workspace = true }
files-sdk-digitalocean = { workspace = true }
files-sdk-hetzner = { workspace = true }
files-sdk-akamai = { workspace = true }
files-sdk-storj = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests requiring a live S3-compatible server (FILES_SDK_INTEGRATION_ENDPOINT)",
    "r2_integration: real Cloudflare R2 tests requiring FILES_SDK_R2_INTEGRATION=1 + R2 env creds",
    "aws_s3_integration: real AWS S3 tests requiring FILES_SDK_AWS_S3_INTEGRATION=1 + AWS env creds",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.380",
    "ruff>=0.7",
    "moto[s3,server]>=5",
    "httpx>=0.27",
    "readme-renderer[md]>=43",
]
