[project]
name = "files-sdk-uploadthing"
version = "0.0.0"
description = "UploadThing adapter for files-sdk (stub)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "files-sdk",
    "httpx>=0.27",
    "sqids>=0.5.2",
]

[project.entry-points."files_sdk.adapters"]
uploadthing = "files_sdk_uploadthing:UploadThingAdapter"
uploadthing-async = "files_sdk_uploadthing:AsyncUploadThingAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/files_sdk_uploadthing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
