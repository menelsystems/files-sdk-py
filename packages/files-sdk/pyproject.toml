[project]
name = "files-sdk"
dynamic = ["version"]
description = "Unified Python SDK for cloud object/blob storage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Carter Himmel", email = "carter@menelsystems.com"}]
keywords = ["storage", "files", "object-storage", "sdk", "s3", "blob"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.8",
]

[project.urls]
Homepage = "https://github.com/menelsystems/files-sdk-py"
Repository = "https://github.com/menelsystems/files-sdk-py"
Issues = "https://github.com/menelsystems/files-sdk-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/files_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
