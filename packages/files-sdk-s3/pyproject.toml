[project]
name = "files-sdk-s3"
version = "0.1.0"
description = "Amazon S3 adapter for files-sdk"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Carter Himmel", email = "carter@menelsystems.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "files-sdk",
    "boto3>=1.35",
    "botocore>=1.35",
    "aioboto3>=13",
]

[project.entry-points."files_sdk.adapters"]
s3 = "files_sdk_s3:S3Adapter"
"s3-async" = "files_sdk_s3:AsyncS3Adapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/files_sdk_s3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
