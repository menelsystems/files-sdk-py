[project]
name = "files-sdk-local"
dynamic = ["version"]
description = "Local filesystem adapter for files-sdk — zero deps, ideal for dev/test"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Carter Himmel", email = "carter@menelsystems.com"}]
keywords = ["local", "filesystem", "storage", "files", "dev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "files-sdk",
]

[project.urls]
Homepage = "https://github.com/menelsystems/files-sdk-py"
Repository = "https://github.com/menelsystems/files-sdk-py"
Issues = "https://github.com/menelsystems/files-sdk-py/issues"

[project.entry-points."files_sdk.adapters"]
local = "files_sdk_local:LocalAdapter"
"local-async" = "files_sdk_local:AsyncLocalAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/files_sdk_local"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
