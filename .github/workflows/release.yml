name: Release

# Tag-driven release. Push a tag of the form `<package>-v<version>` to ship.
# Examples:
#   files-sdk-v0.1.0a1
#   files-sdk-s3-v0.1.0a1
#   files-sdk-r2-v0.2.0
#
# Or trigger manually via workflow_dispatch with explicit inputs (handy for
# dry-runs that build + validate without publishing).
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens. The
# matching publisher must be configured per project at
# https://pypi.org/manage/account/publishing/. See RELEASING.md for setup.

on:
  push:
    tags:
      - 'files-sdk-v*'
      - 'files-sdk-*-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under packages/ (e.g. files-sdk-s3)'
        required: true
        type: string
      version:
        description: 'PEP 440 version (e.g. 0.1.0a1)'
        required: true
        type: string
      dry_run:
        description: 'Build + validate but skip publish'
        required: false
        type: boolean
        default: true

# One release per package at a time. Parallel releases of different packages OK.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # OIDC for Trusted Publishing
      contents: write    # for `gh release create`
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set Python 3.13
        run: uv python install 3.13

      - name: Resolve package and version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pkg="${{ inputs.package }}"
            version="${{ inputs.version }}"
            tag="${pkg}-v${version}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            # Split on the final '-v'
            version="${tag##*-v}"
            pkg="${tag%-v*}"
          fi
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved: package=$pkg version=$version tag=$tag"

      - name: Validate tag matches pyproject version
        run: uv run --no-project --with packaging python tools/check_release_tag.py "${{ steps.meta.outputs.tag }}"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Build wheel + sdist
        working-directory: packages/${{ steps.meta.outputs.pkg }}
        run: uv build

      - name: Verify artifacts contain LICENSE
        working-directory: packages/${{ steps.meta.outputs.pkg }}
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            echo "checking $f"
            python -c "
          import sys, tarfile, zipfile
          path = sys.argv[1]
          opener = zipfile.ZipFile if path.endswith('.whl') else tarfile.open
          names = opener(path).namelist() if path.endswith('.whl') else opener(path).getnames()
          assert any('LICENSE' in n for n in names), f'no LICENSE in {path}: {names[:5]}'
          print(f'  ok: LICENSE present in {path}')
          " "$f"
          done

      - name: Publish to PyPI (Trusted Publishing)
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ steps.meta.outputs.pkg }}/dist
          attestations: true   # PEP 740 provenance

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            packages/${{ steps.meta.outputs.pkg }}/dist/* \
            --title "${{ steps.meta.outputs.pkg }} ${{ steps.meta.outputs.version }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details. Install: \`uv add ${{ steps.meta.outputs.pkg }}==${{ steps.meta.outputs.version }}\`" \
            --verify-tag
